<script>
'use strict';
/* ---------- icons ---------- */
const I={
 today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
 cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>',
 list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>',
 db:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 8v8M3.5 10v4M18 8v8M20.5 10v4M6 12h12"/></svg>',
 more:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
 plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
 play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>',
 up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 15l6-6 6 6"/></svg>',
 down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>',
 x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
 grip:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>',
 w:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 8v8M3.5 10v4M18 8v8M20.5 10v4M6 12h12"/></svg>',
 r:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>',
 c:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 3 20.5c6 2 12 2 18 0z" opacity=".9"/><circle cx="10" cy="13" r="1.4" fill="var(--card)"/><circle cx="14" cy="16" r="1.4" fill="var(--card)"/></svg>',
 ok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
 user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8.5" r="4"/><path d="M4 20.5c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
 edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
 video:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="2.5"/><path d="M16 10.5l5-3v9l-5-3z"/></svg>',
};
const ic=(k,cls)=>`<span class="ic ${cls||k}">${I[k]}</span>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);

/* ---------- dates (local) ---------- */
const pad=n=>String(n).padStart(2,'0');
const ds=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const diffD=(a,b)=>Math.round((pd(a)-pd(b))/864e5);
const todayS=()=>ds(new Date());
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
const fmt=(s,o)=>pd(s).toLocaleDateString(undefined,o||{weekday:'short',month:'short',day:'numeric'});
const nextMonday=()=>{const t=todayS();const wd=pd(t).getDay();return addD(t,((8-wd)%7)||7)};

/* ---------- state ----------
 v2: no exercise library. A routine owns its exercises; each one is just a typed name plus optional details:
   routine.items = [{id,name,mode:'reps'|'time',sets,reps,secs,rest,weight,notes,video}]
 Storage: guest data -> GUEST_KEY (this device only). Signed-in data -> USER_KEY(uid) cache, synced to the account. */
const LEGACY_KEY='workoutPlanner.v1', GUEST_KEY='workoutPlanner.v2.guest', ACC_KEY='workoutPlanner.account';
const USER_KEY=uid=>'workoutPlanner.v2.u.'+uid, META_KEY=uid=>'workoutPlanner.sync.'+uid;
const DEVICE_ID=(()=>{let d=localStorage.getItem('workoutPlanner.device');if(!d){d='dev_'+uid();localStorage.setItem('workoutPlanner.device',d)}return d})();
function seed(){
  const t=todayS();
  return {v:2,routines:[],
   schedule:{mode:'interval',interval:2,start:t,weekdays:[1,3,5],cheatWeekdays:[],cheatDates:[],restDates:[],baseRoutine:''},
   changes:[],history:{},feedbackQueue:[],updatedAt:0};
}
const newItem=(name,o)=>({id:'it_'+uid(),name:String(name||'').trim(),mode:'reps',sets:3,reps:10,secs:30,rest:60,weight:'',notes:'',video:null,...(o||{})});
/* Upgrade any older shape (v1 exercise library + references) to v2. Safe to run on v2 data. */
function migrate(d){
  if(!d||typeof d!=='object')return seed();
  const base=seed();
  const o={...base,...d,schedule:{...base.schedule,...(d.schedule||{})}};
  o.routines=Array.isArray(d.routines)?d.routines.map(r=>({...r})):[];
  o.changes=Array.isArray(d.changes)?d.changes:[];o.history=d.history&&typeof d.history==='object'?d.history:{};
  o.feedbackQueue=Array.isArray(d.feedbackQueue)?d.feedbackQueue:[];
  if(Array.isArray(d.exercises)){
    const lib=new Map(d.exercises.map(e=>[e.id,e])),used=new Set();
    for(const r of o.routines){
      r.items=(r.items||[]).map(it=>{
        if(!it.exId)return it;const e=lib.get(it.exId);if(!e)return null;used.add(e.id);
        return newItem(e.name,{mode:e.mode==='time'?'time':'reps',sets:it.sets||e.sets||3,reps:it.reps||e.reps||10,secs:it.secs||e.secs||30,rest:e.rest??60,weight:e.weight||'',notes:e.notes||'',video:e.video||null});
      }).filter(Boolean);
    }
    // Exercises that weren't in any routine are kept (nothing is lost) in an unscheduled routine.
    const orphans=d.exercises.filter(e=>!used.has(e.id));
    if(orphans.length)o.routines.push({id:'rt_'+uid(),name:'Saved exercises',notes:'Exercises from the old exercise list that were not in a routine.',video:null,
      items:orphans.map(e=>newItem(e.name,{mode:e.mode==='time'?'time':'reps',sets:e.sets||3,reps:e.reps||10,secs:e.secs||30,rest:e.rest??60,weight:e.weight||'',notes:e.notes||'',video:e.video||null}))});
    delete o.exercises;
  }
  for(const r of o.routines){r.items=(r.items||[]).filter(i=>i&&i.name).map(i=>({...newItem(i.name),...i}));r.video=r.video||null}
  if(!o.routines.some(r=>r.id===o.schedule.baseRoutine))o.schedule.baseRoutine=o.routines[0]?.id||'';
  o.v=2;o.updatedAt=d.updatedAt||0;
  return o;
}
const readJSON=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
let ACC=readJSON(ACC_KEY); // null = first launch (welcome screen) | {mode:'guest'} | {mode:'user',uid,email,name,provider}
let S;
(function loadState(){
  let g=readJSON(GUEST_KEY);
  if(!g){const old=readJSON(LEGACY_KEY);if(old){g=migrate(old);localStorage.setItem(GUEST_KEY,JSON.stringify(g));if(!ACC){ACC={mode:'guest'};localStorage.setItem(ACC_KEY,JSON.stringify(ACC))}}}
  if(ACC&&ACC.mode==='user'){const u=readJSON(USER_KEY(ACC.uid));S=migrate(u||g||seed())}
  else S=migrate(g||seed());
})();
const activeKey=()=>ACC&&ACC.mode==='user'?USER_KEY(ACC.uid):GUEST_KEY;
const hasData=s=>!!(s&&((s.routines||[]).length||Object.keys(s.history||{}).length));
function persist(){try{localStorage.setItem(activeKey(),JSON.stringify(S));return true}catch(e){toast('Could not save: storage full?');return false}}
const save=()=>{S.updatedAt=Date.now();if(persist())Sync.changed()};
persist();
const rtById=id=>S.routines.find(r=>r.id===id);
const knownNames=()=>[...new Set(S.routines.flatMap(r=>r.items.map(i=>i.name)).filter(Boolean))].sort((a,b)=>a.localeCompare(b));

/* ---------- IndexedDB for uploaded videos ---------- */
const VDB={db:null,
 open(){return this.db?Promise.resolve(this.db):new Promise((res,rej)=>{const q=indexedDB.open('workoutVideos',1);q.onupgradeneeded=()=>q.result.createObjectStore('v');q.onsuccess=()=>{this.db=q.result;res(this.db)};q.onerror=()=>rej(q.error)})},
 async put(id,blob){const db=await this.open();return new Promise((res,rej)=>{const tx=db.transaction('v','readwrite');tx.objectStore('v').put(blob,id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})},
 async get(id){const db=await this.open();return new Promise((res,rej)=>{const q=db.transaction('v').objectStore('v').get(id);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
 async del(id){const db=await this.open();return new Promise(res=>{const tx=db.transaction('v','readwrite');tx.objectStore('v').delete(id);tx.oncomplete=res;tx.onerror=res})},
 async keys(){const db=await this.open();return new Promise(res=>{const q=db.transaction('v').objectStore('v').getAllKeys();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([])})}};
/* Uploaded videos can be shared by several exercises (and by guest + account data), so they are only removed
   when nothing on this device references them any more. */
async function gcVideos(){
  try{
    const refs=new Set(),add=s=>{if(!s||!s.routines)return;for(const r of s.routines){if(r.video?.fileId)refs.add(r.video.fileId);for(const i of r.items||[])if(i.video?.fileId)refs.add(i.video.fileId)}};
    add(S);for(let k=0;k<localStorage.length;k++){const key=localStorage.key(k);if(/^workoutPlanner\.v[12]/.test(key))add(migrate(readJSON(key)))}
    for(const k of await VDB.keys())if(!refs.has(k))await VDB.del(k);
  }catch(e){}
}

/* ---------- schedule logic ---------- */
function routineFor(d){
  let r=S.schedule.baseRoutine,best='';
  for(const c of S.changes) if(c.type==='switch'&&c.date<=d&&c.date>=best){best=c.date;r=c.routineId}
  return r;
}
function dayInfo(d){
  const sc=S.schedule,wd=pd(d).getDay();
  const add=S.changes.find(c=>c.type==='add'&&c.date===d);
  const done=S.history[d];
  if(add) return {kind:'workout',routineId:add.routineId,extra:true,done};
  if(sc.cheatDates.includes(d)||sc.cheatWeekdays.includes(wd)) return {kind:'cheat',done};
  if(sc.restDates.includes(d)) return {kind:'rest',done};
  let w=false;
  if(sc.mode==='interval'){const k=diffD(d,sc.start);w=k>=0&&k%Math.max(1,sc.interval)===0}
  else w=sc.weekdays.includes(wd);
  if(!w) return {kind:'rest',done};
  return {kind:'workout',routineId:routineFor(d),done};
}
function streak(){
  let d=todayS(),n=0,i=0;
  const t=dayInfo(d); if(t.kind==='workout'&&!S.history[d]) d=addD(d,-1);
  for(;i<400;i++,d=addD(d,-1)){
    const inf=dayInfo(d);
    if(S.history[d]){n++;continue}
    if(inf.kind==='workout')break;
  }
  return n;
}
function nextWorkout(from){for(let i=1;i<60;i++){const d=addD(from,i);const x=dayInfo(d);if(x.kind==='workout')return {d,...x}}return null}
const dayIcon=inf=>inf.done?ic('ok'):inf.kind==='workout'?ic('w'):inf.kind==='cheat'?ic('c'):ic('r');

/* ---------- ui helpers ---------- */
let tab='today';
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2400)}
function sheet(html,onMount){
  closeSheet();
  const bg=document.createElement('div');bg.className='sheet-bg';bg.id='sheet';
  bg.innerHTML=`<div class="sheet" role="dialog"><div class="grab"></div>${html}</div>`;
  bg.addEventListener('click',e=>{if(e.target===bg)closeSheet()});
  document.body.appendChild(bg);onMount&&onMount(bg.firstChild);return bg.firstChild;
}
function closeSheet(){closeSheet2();const s=$('#sheet');if(s){s.querySelectorAll('video').forEach(v=>v.pause());s.remove()}revokeUrls();setTimeout(()=>Sync.applyDeferred(),0)}
function sheet2(html,onMount){
  closeSheet2();
  const bg=document.createElement('div');bg.className='sheet-bg l2';bg.id='sheet2';
  bg.innerHTML=`<div class="sheet" role="dialog"><div class="grab"></div>${html}</div>`;
  bg.addEventListener('click',e=>{if(e.target===bg)closeSheet2()});
  document.body.appendChild(bg);onMount&&onMount(bg.firstChild);return bg.firstChild;
}
function closeSheet2(){const s=$('#sheet2');if(s){s.querySelectorAll('video').forEach(v=>v.pause());s.remove()}}
let objUrls=[];function revokeUrls(){objUrls.forEach(u=>URL.revokeObjectURL(u));objUrls=[]}
const prescription=(ex,ov)=>{ov=ov||{};const sets=ov.sets||ex.sets,mode=ex.mode;const amt=mode==='time'?`${ov.secs||ex.secs}s`:`${ov.reps||ex.reps} reps`;return `${sets} × ${amt}${ex.weight?' · '+esc(ex.weight):''}`};

function ytId(u){const m=String(u).match(/(?:youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/|v\/)|youtu\.be\/)([\w-]{11})/);return m?m[1]:null}
async function videoHTML(v){
  if(!v)return '';
  if(v.type==='url'&&v.url){
    const id=ytId(v.url);
    const offline=!navigator.onLine?'<div class="small mut" style="margin:-6px 0 10px">You\'re offline — online videos need a connection. Uploaded videos work offline.</div>':'';
    if(id)return `<div class="vid"><iframe src="https://www.youtube-nocookie.com/embed/${id}?rel=0&playsinline=1" title="How-to video" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe></div>${offline}`;
    return `<div class="vid"><video src="${esc(v.url)}" controls playsinline preload="metadata"></video></div>${offline}<div class="small"><a href="${esc(v.url)}" target="_blank" rel="noopener">Open link</a></div>`;
  }
  if(v.type==='file'&&v.fileId){
    const b=await VDB.get(v.fileId).catch(()=>null);
    if(!b)return '<div class="small mut">Video file not found on this device (uploaded videos don\'t transfer in backups).</div>';
    const u=URL.createObjectURL(b);objUrls.push(u);
    return `<div class="vid"><video src="${u}" controls playsinline preload="metadata" data-file="1"></video></div>`;
  }
  return '';
}
async function showVideo(title,v){
  const s=sheet(`<h2>${esc(title)}</h2><div id="vbox"><div class="mut">Loading…</div></div><button class="btn w" onclick="closeSheet()">Close</button>`);
  s.querySelector('#vbox').innerHTML=(await videoHTML(v))||'<div class="mut">No video.</div>';
}

/* ---------- render ---------- */
function render(){
  if(tab==='ex')tab='rt';
  const titles={today:'Today',cal:'Calendar',rt:'Routines'};
  $('#title').textContent=titles[tab];
  const acc=ACC&&ACC.mode==='user'?`<button class="ib" aria-label="Account" id="accBtn" onclick="accountSheet()"><span class="av">${esc((ACC.email||ACC.name||'?')[0].toUpperCase())}</span></button>`:`<button class="ib" aria-label="Account" id="accBtn" onclick="accountSheet()">${I.user}</button>`;
  $('#hdr').innerHTML=`<div class="hdr-r">${tab==='rt'?`<button class="ib" aria-label="New routine" onclick="editRoutine()">${I.plus}</button>`:''}${acc}<button class="ib" aria-label="More" id="moreBtn" onclick="moreSheet()">${I.more}</button></div>`;
  $('#tabs').innerHTML=[['today','Today',I.today],['cal','Calendar',I.cal],['rt','Routines',I.list]].map(([k,l,s])=>`<button class="tab ${tab===k?'on':''}" data-tab="${k}" onclick="go('${k}')">${s}<span>${l}</span></button>`).join('');
  ({today:rToday,cal:rCal,rt:rRoutines})[tab]();
}
function go(t){tab=t;window.scrollTo(0,0);render()}

function rToday(){
  const t=todayS(),inf=dayInfo(t);let h='';
  if(S.feedbackQueue.length)h+=`<div class="banner">${S.feedbackQueue.length} feedback note${S.feedbackQueue.length>1?'s':''} waiting to send <span class="sp"></span><button class="btn s p" onclick="sendQueued()">${navigator.onLine?'Open':'Offline'}</button></div>`;
  const ses=readJSON(SESSION_KEY);
  if(ses&&ses.owner===activeKey()&&rtById(ses.rid)&&!W)h+=`<div class="banner" id="resumeBanner">${I.play.replace('<svg','<svg width="18" height="18"')} ${esc(rtById(ses.rid).name)} in progress <span class="sp"></span><button class="btn s p" id="resumeBtn" onclick="resumeWorkout(readJSON(SESSION_KEY))">Resume</button></div>`;
  h+=`<div class="mut small" style="margin:0 4px 8px">${fmt(t,{weekday:'long',month:'long',day:'numeric'})}</div>`;
  if(inf.kind==='workout'){
    const r=rtById(inf.routineId);
    if(!r)h+=S.routines.length?`<div class="card"><div class="big">Workout day</div><div class="mut">No routine set. Pick one in Calendar → Plan.</div></div>`:`<div class="card" style="text-align:center;padding:26px 16px"><div class="big">Let's build your routine</div><div class="mut" style="margin-bottom:14px">Type in your own exercises, any you like.</div><button class="btn p" id="firstRoutine" onclick="go('rt');editRoutine()">${I.plus} Create routine</button></div>`;
    else{
      h+=`<div class="card"><div class="row"><span class="tag">${inf.extra?'Added workout':'Workout day'}</span><span class="sp"></span>${inf.done?ic('ok')+'<span class="small" style="color:var(--ok);font-weight:600">Done</span>':''}</div>
      <div class="big">${esc(r.name)}</div><div class="mut small">${r.items.length} exercises</div>
      <div class="list" style="margin:8px 0 12px">${r.items.map(e=>`<div class="it"><div class="sp"><div class="t">${esc(e.name)}</div><div class="small mut">${prescription(e)}</div></div>${e.video?`<button class="ib" aria-label="Video" onclick="showItemVideo('${r.id}','${e.id}')">${I.video}</button>`:''}</div>`).join('')||'<div class="small mut" style="padding:8px 0">No exercises yet. Edit the routine to add some.</div>'}</div>
      ${r.video?`<button class="btn w" style="margin-bottom:8px" onclick="showVideo(rtById('${r.id}').name,rtById('${r.id}').video)">${I.video} Routine video</button>`:''}
      <button class="btn p w startbig" id="startBtn" onclick="startWorkout('${r.id}')">${I.play} ${inf.done?'Do it again':'Start workout'}</button></div>`;
    }
  }else{
    const nx=nextWorkout(t);
    h+=`<div class="card" style="text-align:center;padding:28px 16px"><div style="transform:scale(2.2);margin:6px 0 16px">${dayIcon({kind:inf.kind})}</div><div class="big">${inf.kind==='cheat'?'Cheat day':'Rest day'}</div>
    <div class="mut">${inf.kind==='cheat'?'Enjoy it. Back at it soon.':'Recover well.'}</div>${nx?`<div class="small mut" style="margin-top:10px">Next: <b>${esc(rtById(nx.routineId)?.name||'Workout')}</b> · ${fmt(nx.d)}</div>`:''}
    ${inf.done?`<div style="margin-top:10px;color:var(--ok);font-weight:600">${ic('ok')} Workout logged</div>`:''}
    ${rtById(routineFor(t))?.items.length?`<button class="btn w startbig" style="margin-top:16px" id="startBtn" onclick="startWorkout('${routineFor(t)}')">${I.play} Start workout anyway</button>`:''}</div>`;
  }
  // week strip
  const wd=pd(t).getDay(),ws=addD(t,-((wd+6)%7));
  h+=`<div class="card"><div class="week">${[0,1,2,3,4,5,6].map(i=>{const d=addD(ws,i),x=dayInfo(d);return `<div class="d ${d===t?'today':''}">${WD[pd(d).getDay()][0]}<b>${pd(d).getDate()}</b>${dayIcon(x)}</div>`}).join('')}</div></div>`;
  const total=Object.keys(S.history).length,wk=Object.keys(S.history).filter(d=>d>=ws&&d<=addD(ws,6)).length;
  h+=`<div class="card stat"><div><b id="streak">${streak()}</b><span class="small mut">streak</span></div><div><b>${wk}</b><span class="small mut">this week</span></div><div><b>${total}</b><span class="small mut">total</span></div></div>`;
  const hist=Object.entries(S.history).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,7);
  if(hist.length)h+=`<h3>History</h3><div class="card list">${hist.map(([d,x])=>`<div class="it">${ic('ok')}<div class="sp"><div class="t">${esc(rtById(x.routineId)?.name||x.name||'Workout')}</div><div class="small mut">${fmt(d)}${x.sets?` · ${x.sets} sets`:''}${x.duration?` · ${fmtDur(x.duration)}`:''}</div></div></div>`).join('')}</div>`;
  h+=`<div style="text-align:center;margin-top:8px"><button class="btn g" id="todayFeedback" onclick="feedbackSheet()">Send feedback</button></div>`;
  $('#main').innerHTML=h;
}

let calM=null;
function rCal(){
  const t=todayS();if(!calM)calM=t.slice(0,7);
  const [y,m]=calM.split('-').map(Number),first=new Date(y,m-1,1),off=(first.getDay()+6)%7,start=addD(ds(first),-off);
  const chgDates=new Set(S.changes.map(c=>c.date));
  let h=`<div class="card"><div class="row" style="margin-bottom:8px"><button class="ib" aria-label="Previous month" onclick="calShift(-1)">${I.up.replace('M6 15l6-6 6 6','M15 6l-6 6 6 6')}</button><div class="sp" style="text-align:center;font-weight:700" id="calTitle">${MON[m-1]} ${y}</div><button class="ib" aria-label="Next month" onclick="calShift(1)">${I.up.replace('M6 15l6-6 6 6','M9 6l6 6-6 6')}</button></div>
  <div class="cal">${['M','T','W','T','F','S','S'].map(x=>`<div class="h">${x}</div>`).join('')}`;
  for(let i=0;i<42;i++){const d=addD(start,i),x=dayInfo(d),r=x.kind==='workout'?rtById(x.routineId):null;
    h+=`<button data-d="${d}" class="${d.slice(0,7)!==calM?'o':''} ${d===t?'today':''} ${chgDates.has(d)?'chg':''}" title="${x.kind}${r?': '+esc(r.name):''}" data-kind="${x.kind}" data-rt="${r?esc(r.name):''}" onclick="daySheet('${d}')"><span class="n">${pd(d).getDate()}</span>${dayIcon(x)}</button>`}
  h+=`</div><div class="legend"><span>${ic('w')} Workout</span><span>${ic('r')} Rest</span><span>${ic('c')} Cheat</span><span>${ic('ok')} Done</span><span><span style="display:inline-block;width:14px;height:3px;background:var(--acc);vertical-align:middle"></span> Plan change</span></div></div>`;
  // upcoming changes
  const up=S.changes.filter(c=>c.date>=t).sort((a,b)=>a.date.localeCompare(b.date));
  h+=`<h3>Upcoming changes</h3><div class="card"><div class="list" id="changes">${up.length?up.map(c=>`<div class="it"><div class="sp"><div class="t">${c.type==='switch'?'Switch to ':'Add '}${esc(rtById(c.routineId)?.name||'(deleted)')}</div><div class="small mut">${c.type==='switch'?'Starting ':'On '}${fmt(c.date,{weekday:'short',month:'short',day:'numeric',year:'numeric'})}</div></div><button class="btn s d" onclick="cancelChange('${c.id}')">Cancel</button></div>`).join(''):'<div class="mut small">None. Schedule a routine to start later.</div>'}</div>
  <button class="btn p w" style="margin-top:10px" id="schedBtn" onclick="changeSheet()">Schedule a change</button></div>`;
  // plan
  const sc=S.schedule;
  h+=`<h3>Plan</h3><div class="card" id="plan">
   <label class="f"><span>Routine</span><select id="baseRt" onchange="S.schedule.baseRoutine=this.value;save();render()">${S.routines.map(r=>`<option value="${r.id}" ${r.id===sc.baseRoutine?'selected':''}>${esc(r.name)}</option>`).join('')||'<option>No routines</option>'}</select></label>
   <div class="seg"><button class="${sc.mode==='interval'?'on':''}" id="modeInterval" onclick="setSc('mode','interval')">Every N days</button><button class="${sc.mode==='weekdays'?'on':''}" id="modeWeek" onclick="setSc('mode','weekdays')">Pick weekdays</button></div>
   ${sc.mode==='interval'?`<div class="g2"><label class="f"><span>Workout every</span><select id="interval" onchange="setSc('interval',+this.value)">${[1,2,3,4,5,6,7].map(n=>`<option value="${n}" ${n===sc.interval?'selected':''}>${n===1?'day':n+' days'}</option>`).join('')}</select></label><label class="f"><span>Starting</span><input type="date" id="startDate" value="${sc.start}" onchange="this.value&&setSc('start',this.value)"></label></div><div class="small mut" style="margin:-4px 0 12px">${sc.interval>1?`${sc.interval-1} rest day${sc.interval>2?'s':''} between workouts`:'Every day'}</div>`
   :`<div class="small mut" style="margin-bottom:6px">Workout days</div><div class="chips" id="wdChips">${[1,2,3,4,5,6,0].map(i=>`<button class="chip ${sc.weekdays.includes(i)?'on':''}" onclick="toggleArr('weekdays',${i})">${WD[i]}</button>`).join('')}</div>`}
   <div class="small mut" style="margin-bottom:6px">Cheat day every</div><div class="chips" id="cheatChips">${[1,2,3,4,5,6,0].map(i=>`<button class="chip ${sc.cheatWeekdays.includes(i)?'on':''}" data-wd="${i}" onclick="toggleArr('cheatWeekdays',${i})">${WD[i]}</button>`).join('')}</div>
   <div class="small mut" style="margin-bottom:6px">Specific cheat &amp; rest dates <span>(or tap a day above)</span></div>
   <div class="row" style="margin-bottom:8px"><input type="date" id="specDate" value="${t}" style="flex:1"><button class="btn s" onclick="addSpec('cheatDates')">+ Cheat</button><button class="btn s" onclick="addSpec('restDates')">+ Rest</button></div>
   <div class="chips">${[...sc.cheatDates.map(d=>['cheatDates',d,'c']),...sc.restDates.map(d=>['restDates',d,'r'])].sort((a,b)=>a[1].localeCompare(b[1])).filter(x=>x[1]>=addD(t,-30)).map(([k,d,i])=>`<button class="chip" onclick="toggleArr('${k}','${d}')">${ic(i)} ${fmt(d,{month:'short',day:'numeric'})} ✕</button>`).join('')}</div>
  </div>`;
  $('#main').innerHTML=h;
}
function calShift(n){const [y,m]=calM.split('-').map(Number);const d=new Date(y,m-1+n,1);calM=ds(d).slice(0,7);render()}
function setSc(k,v){S.schedule[k]=v;save();render()}
function toggleArr(k,v){const a=S.schedule[k],i=a.indexOf(v);i<0?a.push(v):a.splice(i,1);save();render()}
function addSpec(k){const d=$('#specDate').value;if(!d)return;const o=k==='cheatDates'?'restDates':'cheatDates';S.schedule[o]=S.schedule[o].filter(x=>x!==d);if(!S.schedule[k].includes(d))S.schedule[k].push(d);save();render()}
function cancelChange(id){S.changes=S.changes.filter(c=>c.id!==id);save();render();toast('Change cancelled')}
function daySheet(d){
  const x=dayInfo(d),sc=S.schedule,r=x.kind==='workout'?rtById(x.routineId):null;
  const isC=sc.cheatDates.includes(d),isR=sc.restDates.includes(d),add=S.changes.find(c=>c.type==='add'&&c.date===d);
  sheet(`<h2>${fmt(d,{weekday:'long',month:'long',day:'numeric'})}</h2>
   <div class="card row">${dayIcon(x)}<div class="sp"><div class="t">${x.kind==='workout'?esc(r?.name||'Workout'):x.kind==='cheat'?'Cheat day':'Rest day'}</div>${x.done?'<div class="small" style="color:var(--ok)">Completed</div>':''}</div></div>
   <div class="g2" style="margin-bottom:10px"><button class="btn" onclick="dayToggle('${d}','cheatDates')">${isC?'Remove cheat':'Make cheat day'}</button><button class="btn" onclick="dayToggle('${d}','restDates')">${isR?'Remove rest':'Make rest day'}</button></div>
   ${add?`<button class="btn w d" onclick="cancelChange('${add.id}');closeSheet()">Remove added workout</button>`:`<button class="btn w" style="margin-bottom:10px" onclick="changeSheet('add','${d}')">Add a workout this day</button>`}
   ${x.done?`<button class="btn w d" onclick="delete S.history['${d}'];save();closeSheet();render()">Unmark done</button>`:(d<=todayS()&&x.kind==='workout'?`<button class="btn w" onclick="S.history['${d}']={routineId:'${x.routineId}',at:Date.now()};save();closeSheet();render()">Mark as done</button>`:'')}
  `);
}
function dayToggle(d,k){const o=k==='cheatDates'?'restDates':'cheatDates';S.schedule[o]=S.schedule[o].filter(x=>x!==d);toggleArr(k,d);closeSheet()}
function changeSheet(type,date){
  type=type||'switch';date=date||nextMonday();
  if(!S.routines.length){toast('Create a routine first');return}
  sheet(`<h2>Schedule a change</h2>
   <div class="seg"><button id="ctSwitch" class="${type==='switch'?'on':''}" onclick="this.classList.add('on');ctAdd.classList.remove('on');ctHint.textContent='From this date on, this routine replaces the current one.'">Switch routine</button><button id="ctAdd" class="${type==='add'?'on':''}" onclick="this.classList.add('on');ctSwitch.classList.remove('on');ctHint.textContent='One extra workout on this date only.'">Add one workout</button></div>
   <label class="f"><span>Routine</span><select id="chRt">${S.routines.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select></label>
   <label class="f"><span>Date</span><input type="date" id="chDate" value="${date}" min="${todayS()}"></label>
   <div class="chips"><button class="chip" id="qNextWeek" onclick="chDate.value=nextMonday()">Next week (Mon)</button><button class="chip" onclick="chDate.value=addD(todayS(),1)">Tomorrow</button><button class="chip" onclick="chDate.value=addD(todayS(),7)">In 7 days</button></div>
   <p class="small mut" id="ctHint">${type==='switch'?'From this date on, this routine replaces the current one.':'One extra workout on this date only.'}</p>
   <button class="btn p w" id="chSave" onclick="saveChange()">Schedule</button>`);
}
function saveChange(){
  const type=$('#ctAdd').classList.contains('on')?'add':'switch',d=$('#chDate').value,r=$('#chRt').value;
  if(!d){toast('Pick a date');return}
  S.changes=S.changes.filter(c=>!(c.date===d&&c.type===type));
  S.changes.push({id:uid(),type,date:d,routineId:r});save();closeSheet();calM=d.slice(0,7);render();
  toast(`${type==='switch'?'Switches to':'Adds'} ${rtById(r).name} on ${fmt(d)}`);
}

function rRoutines(){
  let h=S.routines.length?'':`<div class="empty">No routines yet.<br><br><button class="btn p" id="createRoutine" onclick="editRoutine()">Create routine</button></div>`;
  h+=S.routines.map(r=>{const using=routineFor(todayS())===r.id;return `<div class="card" onclick="editRoutine('${r.id}')" style="cursor:pointer"><div class="row"><div class="sp"><div class="t" style="font-size:18px">${esc(r.name)}</div><div class="small mut">${r.items.length} exercise${r.items.length===1?'':'s'}${r.video?' · video':''}</div></div>${using?'<span class="tag">Current</span>':''}</div>
   <div class="small mut" style="margin-top:8px">${r.items.map(i=>esc(i.name)).join(' · ')}</div>${r.items.length?`<button class="btn p w" style="margin-top:12px" data-start="${r.id}" onclick="event.stopPropagation();startWorkout('${r.id}')">${I.play} Start workout</button>`:''}</div>`}).join('');
  $('#main').innerHTML=h;
}

  return `<label class="f"><span>How-to video <span style="font-weight:400">(optional)</span></span></label>

function wireVideoPicker(root,v){

async function collectVideo(root,old){

function dragStart(ev){

/* ---------- guided workout session ----------
 The session is saved to this device as you go (SESSION_KEY), with real timestamps instead of counters, so the
 elapsed clock and rest timer stay correct if the app is backgrounded, the screen locks or Android kills the app.
 Re-opening the app resumes the same session instead of starting a duplicate. */
const SESSION_KEY='workoutPlanner.session';
let W=null,timerInt=null;
function saveSession(){if(W)try{localStorage.setItem(SESSION_KEY,JSON.stringify({rid:W.rid,i:W.i,done:W.done,startedAt:W.startedAt,restEnd:W.restEnd||0,date:W.date,owner:activeKey()}))}catch(e){}}
function clearSession(){localStorage.removeItem(SESSION_KEY)}
function sessionItems(rid){const r=rtById(rid);return r?r.items.map(i=>({it:i,e:i})):[]}
function startWorkout(rid){
  const old=readJSON(SESSION_KEY);
  if(old&&old.owner===activeKey()&&rtById(old.rid)){
    if(old.rid===rid||confirm(`You have a ${rtById(old.rid).name} workout in progress. Continue it?`)){resumeWorkout(old);return}
  }
  const items=sessionItems(rid);
  if(!items.length){toast('This routine has no exercises yet');return}
  W={rid,items,i:0,done:items.map(x=>Array(Math.max(1,x.e.sets||1)).fill(false)),restEnd:0,startedAt:Date.now(),date:todayS()};
  openW();
}
function resumeWorkout(s){
  const items=sessionItems(s.rid);if(!items.length){clearSession();return}
  // routine may have been edited (or synced from another phone) since: keep ticks where they still fit
  const done=items.map((x,k)=>{const a=Array(Math.max(1,x.e.sets||1)).fill(false);(s.done[k]||[]).forEach((v,j)=>{if(j<a.length)a[j]=!!v});return a});
  W={rid:s.rid,items,i:Math.min(s.i||0,items.length-1),done,restEnd:s.restEnd>Date.now()?s.restEnd:0,startedAt:s.startedAt||Date.now(),date:s.date||todayS()};
  openW();toast('Resumed your workout');
}
function openW(){
  $('#wo')?.remove();const o=document.createElement('div');o.className='wo';o.id='wo';document.body.appendChild(o);document.body.style.overflow='hidden';
  saveSession();drawW();clearInterval(timerInt);timerInt=setInterval(tickW,500);lockScreen();
}
function lockScreen(){try{if(W&&!W.lock&&navigator.wakeLock)navigator.wakeLock.request('screen').then(l=>{if(W)W.lock=l;l.addEventListener('release',()=>{if(W)W.lock=null})}).catch(()=>{})}catch(e){}}
const restLeft=()=>W&&W.restEnd?Math.max(0,Math.ceil((W.restEnd-Date.now())/1000)):0;
function tickW(){
  if(!W){clearInterval(timerInt);return}
  const el=$('#woElapsed');if(el)el.textContent=fmtT(Math.floor((Date.now()-W.startedAt)/1000));
  if(W.restEnd){const s=restLeft();if(s<=0){endRest(true)}else{const t=$('#restT');t?t.textContent=fmtT(s):drawW()}}
}
function drawW(){
  const o=$('#wo');if(!o||!W)return;const {e}=W.items[W.i],sets=W.done[W.i];
  const totalSets=W.done.flat().length,doneSets=W.done.flat().filter(Boolean).length;
  const amt=e.mode==='time'?`${e.secs}s`:`${e.reps} reps`,rl=restLeft();
  o.innerHTML=`<div class="row"><button class="ib" aria-label="Exit" onclick="exitW()">${I.x}</button><div class="sp" style="text-align:center"><div style="font-weight:600">${esc(rtById(W.rid)?.name||'')}</div><div class="small mut"><span id="woElapsed">${fmtT(Math.floor((Date.now()-W.startedAt)/1000))}</span> elapsed</div></div><span class="small mut" style="width:44px;text-align:right" id="woPos">${W.i+1}/${W.items.length}</span></div>
   <div class="prog"><i style="width:${doneSets/totalSets*100}%"></i></div>
   <div class="small mut" id="woSets">${doneSets} of ${totalSets} sets done</div>
   <div class="big" id="woName" style="font-size:30px">${esc(e.name)}</div>
   <div class="mut">${sets.length} × ${amt}${e.weight?' · '+esc(e.weight):''}${e.rest>0?' · rest '+e.rest+'s':''}</div>
   ${e.notes?`<p class="small mut">${esc(e.notes)}</p>`:''}
   ${e.video?`<button class="btn w" id="woVideo" style="margin:10px 0" onclick="showVideo(W.items[W.i].e.name,W.items[W.i].e.video)">${I.video} How-to video</button>`:''}
   ${rl>0?`<div class="card" style="margin-top:12px" id="restCard"><div class="small mut" style="text-align:center">Rest</div><div class="timer" id="restT">${fmtT(rl)}</div><div class="g2"><button class="btn" onclick="W.restEnd+=15000;saveSession();drawW()">+15s</button><button class="btn" id="skipRest" onclick="endRest()">Skip</button></div></div>`:''}
   <div style="margin-top:8px">${sets.map((d,k)=>`<div class="setrow"><button class="setbtn ${d?'on':''}" data-set="${k}" aria-label="Set ${k+1}" onclick="toggleSet(${k})">${d?I.ok.replace('<svg','<svg width="24" height="24"'):k+1}</button><div class="sp"><b>Set ${k+1}</b><div class="small mut">${amt}</div></div></div>`).join('')}</div>
   <label class="row small mut" style="margin-top:12px;min-height:40px"><input type="checkbox" id="autoRest" ${S.settings?.autoRest===false?'':'checked'} onchange="S.settings={...(S.settings||{}),autoRest:this.checked};save()"> Rest timer after each set</label>
   <div class="g2" style="margin-top:12px"><button class="btn" id="woPrev" ${W.i===0?'disabled style="opacity:.4"':''} onclick="W.i--;W.restEnd=0;saveSession();drawW()">Previous</button>
   ${W.i<W.items.length-1?`<button class="btn p" id="woNext" onclick="W.i++;W.restEnd=0;saveSession();drawW()">Next</button>`:`<button class="btn p" id="woFinish" onclick="finishW()">Finish</button>`}</div>
   ${W.i<W.items.length-1?`<button class="btn w g" style="margin-top:8px" id="woFinishEarly" onclick="finishW()">Finish workout</button>`:''}`;
}
const fmtT=s=>s>=3600?`${Math.floor(s/3600)}:${pad(Math.floor(s/60)%60)}:${pad(s%60)}`:`${Math.floor(s/60)}:${pad(s%60)}`;
function toggleSet(k){
  const a=W.done[W.i];a[k]=!a[k];const rest=W.items[W.i].e.rest;
  if(a[k]&&rest>0&&S.settings?.autoRest!==false&&!(a.every(Boolean)&&W.i===W.items.length-1))W.restEnd=Date.now()+rest*1000;
  if(!a[k])W.restEnd=0;
  saveSession();drawW();
}
function endRest(alarm){if(!W)return;W.restEnd=0;if(alarm){try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}beep()}
  const a=W.done[W.i];if(a.every(Boolean)&&W.i<W.items.length-1)W.i++;saveSession();drawW()}
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.value=.08;o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+.25)}catch(e){}}
function closeW(){clearInterval(timerInt);try{W?.lock?.release()}catch(e){}W=null;clearSession();$('#wo')?.remove();document.body.style.overflow='';setTimeout(()=>Sync.applyDeferred(),0)}
function exitW(){const any=W.done.flat().some(Boolean);if(any&&!confirm('Leave this workout? It won\'t be logged.'))return;closeW()}
function finishW(){
  const n=W.done.flat().filter(Boolean).length,total=W.done.flat().length;
  if(!n&&!confirm('No sets ticked yet. Log the workout anyway?'))return;
  const dur=Math.round((Date.now()-W.startedAt)/1000),d=W.date||todayS(),prev=S.history[d];
  // One entry per day: doing a second session the same day extends the entry instead of duplicating it.
  S.history[d]=prev?{...prev,routineId:W.rid,name:rtById(W.rid)?.name,at:Date.now(),sets:(prev.sets||0)+n,totalSets:(prev.totalSets||0)+total,duration:(prev.duration||0)+dur,sessions:(prev.sessions||1)+1}
    :{routineId:W.rid,name:rtById(W.rid)?.name,at:Date.now(),startedAt:W.startedAt,sets:n,totalSets:total,duration:dur,sessions:1};
  save();closeW();tab='today';render();toast(`Workout logged · ${fmtDur(dur)} · ${n} sets 💪`);
}
const fmtDur=s=>s<60?`${s}s`:s<3600?`${Math.round(s/60)} min`:`${Math.floor(s/3600)} h ${Math.round(s/60)%60} min`;
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&W){tickW();drawW();lockScreen()}});

function exportData(){

$('#importFile').onchange=async e=>{

/* ---------- automatic updates (Android app) ----------

 non-draft release that has a Workout-X.Y.Z.apk asset, and offers it if it's newer than APP_VERSION.
 "Update now" downloads the APK natively and opens Android's installer (one tap on Install). */
const cmpVer=(a,b)=>{const x=String(a).split('.').map(n=>parseInt(n)||0),y=String(b).split('.').map(n=>parseInt(n)||0);for(let i=0;i<3;i++){if((x[i]||0)!==(y[i]||0))return (x[i]||0)>(y[i]||0)?1:-1}return 0};

  last:0,showing:false,pending:null,

  async latest(){

    if(!r.ok)throw new Error('HTTP '+r.status);
    const list=await r.json();
    for(const rel of Array.isArray(list)?list:[list]){
      if(!rel||rel.draft||rel.prerelease)continue;
      const a=(rel.assets||[]).find(a=>/^Workout-\d+\.\d+\.\d+\.apk$/i.test(a.name||''));
      if(a)return {version:String(rel.tag_name||a.name.replace(/^Workout-|\.apk$/gi,'')).replace(/^v/i,''),notes:rel.body||'',url:a.browser_download_url,name:a.name,size:a.size||0,page:rel.html_url};

  async check(manual){
    if(!manual&&!NATIVE_APP&&!window.WORKOUT_UPDATE_FEED)return; // the web version updates itself (service worker)
    if(!manual&&Date.now()-this.last<6*3600e3)return;
    if(!navigator.onLine){if(manual)toast('You\'re offline');return}
    this.last=Date.now();
    try{
      const l=await this.latest();
      if(l&&cmpVer(l.version,APP_VERSION)>0){if(!manual&&(W||$('#welcome'))){this.pending=l;return}this.prompt(l)}
      else if(manual)toast(`You're up to date (v${APP_VERSION})`);
    }catch(e){console.warn('update check',e);if(manual)toast('Couldn\'t check for updates. Try again later.')}
  },
  prompt(l){
    if(this.showing)return;this.showing=true;
    const notes=esc(l.notes.replace(/\r/g,'').slice(0,600)).replace(/\n/g,'<br>');
    const fn=$('#sheet')?sheet2:sheet;
    const root=fn(`<h2>Update available</h2><p id="updText">Version <b id="updVer">${esc(l.version)}</b> is ready. You have ${APP_VERSION}.${l.size?` (${(l.size/1e6).toFixed(1)} MB)`:''}</p>
     ${notes?`<div class="small mut" style="margin:-4px 0 12px;max-height:160px;overflow:auto">${notes}</div>`:''}
     <div class="bar" id="updBar" hidden><i></i></div>
     <button class="btn p w" id="updNow">Update now</button><button class="btn w g" style="margin-top:6px" id="updLater">Later</button>`);

  },
  async install(l,root){

    }

    let h=null;try{h=await AU.addListener('progress',p=>{const pc=p.total>0?Math.round(p.loaded/p.total*100):0;q('#updBar i').style.width=pc+'%';btn.textContent=`Downloading… ${pc}%`})}catch(e){}
    try{
      const r=await AU.downloadAndInstall({url:l.url,fileName:l.name});
      q('#updBar i').style.width='100%';
      if(r&&r.status==='needs-permission'){
        q('#updText').innerHTML='One more step: allow <b>Install unknown apps</b> for Workout, then come back. The update installs right after.';
        btn.disabled=false;btn.textContent='Open settings';btn.onclick=()=>AU.openInstallSettings();
        this.waitPerm={l,root};
      }else{q('#updText').innerHTML='Tap <b>Install</b> on the next screen to finish. Your data stays.';btn.textContent='Install';btn.disabled=false;btn.onclick=()=>AU.installDownloaded({fileName:l.name})}
    }catch(e){q('#updText').textContent='Download failed: '+(e&&e.message||e)+'. Check your connection and try again.';btn.disabled=false;btn.textContent='Try again';}
    finally{try{h&&h.remove()}catch(e){}}
  },
  async resumed(){
    const w=this.waitPerm,AU=capPlugin('AppUpdater');
    if(w&&AU){try{const c=await AU.canInstall();if(c&&c.allowed){this.waitPerm=null;await AU.installDownloaded({fileName:w.l.name})}}catch(e){}}
    if(this.pending&&!W&&!$('#welcome')){const l=this.pending;this.pending=null;this.prompt(l)}
    this.check(false);
  },
};

/* ---------- day rollover & boot ---------- */
let lastDay=todayS();
document.addEventListener('visibilitychange',()=>{if(document.hidden)return;
  if(todayS()!==lastDay){lastDay=todayS();if(!W&&!$('#sheet'))render()}
  Sync.run('resume');Updater.resumed();});
addEventListener('online',()=>Sync.run('online'));
render();
if(!ACC)showWelcome();
Accounts.start();
setTimeout(()=>Updater.check(false),1200);
setTimeout(gcVideos,4000);
{const s=readJSON(SESSION_KEY);if(s&&s.owner===activeKey()&&rtById(s.rid)&&ACC)resumeWorkout(s)}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(e=>console.warn('SW failed',e)));
}
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
</script>
